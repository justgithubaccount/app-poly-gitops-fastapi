name: Python Tests
on:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'Taskfile.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.claude/CLAUDE.md'
      - '.github/workflows/test.yaml'
      - '.github/workflows/release.yaml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Run tests
        env:
          OTEL_SDK_DISABLED: true
        run: uv run pytest --cov=app tests/
      - name: Type check
        run: uv run mypy app --ignore-missing-imports
      - name: Lint
        run: uv run ruff check app tests

      - name: Validate Compose configuration
        run: docker compose config --quiet

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: app-poly-gitops-fastapi:test
      - name: Verify offline runtime startup
        run: tests/test_container_runtime.sh app-poly-gitops-fastapi:test

  release-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - name: Reject critical release-toolchain advisories
        run: npm audit --audit-level=critical
