name: Python Tests
on:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test.yaml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --dev
      - name: Run tests
        env:
          OTEL_SDK_DISABLED: true
        run: uv run pytest --cov=app tests/
      - name: Type check
        run: uv run mypy app --ignore-missing-imports
      - name: Lint
        run: uv run ruff check app

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: app-poly-gitops-fastapi:test
      - name: Verify offline runtime startup
        run: tests/test_container_runtime.sh app-poly-gitops-fastapi:test
